[project]
name = "agent-memory"
version = "0.1.0"
description = "Lesson 6: agent memory and context engineering: a safe memory-tool backend, consolidation, context strategies with cache-aware cost, memory evals"
requires-python = ">=3.13,<3.14"
dependencies = ["anthropic>=1.11,<2"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "secure-agent"
version = "0.1.0"
description = "Lesson 3: agent security: MCP OAuth resource server with OpenBao-issued JWTs, rule-of-two tool policy, injection guards, red-team suite"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=1.11,<2",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

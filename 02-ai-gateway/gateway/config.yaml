# LiteLLM proxy config. Apps never see a provider key or a real model name: they ask for an ALIAS
# ("smart", "fast", "cheap") with a virtual key, and the gateway decides where it goes.

model_list:
  # "smart": Opus first. Two deployments of the same alias would be load-balanced; here there is one,
  # and router_settings.fallbacks sends overflow to "fast".
  - model_name: smart
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY        # rendered from OpenBao by gateway/entrypoint.py
      api_base: os.environ/ANTHROPIC_API_BASE      # the fake provider by default; https://api.anthropic.com for real
      rpm: 60                                       # provider-side limit the router respects
    model_info:
      input_cost_per_token: 0.000004                # $4 / MTok   (set explicitly: never trust a stale price map)
      output_cost_per_token: 0.00002                # $20 / MTok

  - model_name: fast
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_API_BASE
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001

  - model_name: cheap
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_API_BASE
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1                     # one quick retry on the same deployment...
  retry_after: 0
  fallbacks: [{"smart": ["fast"]}]   # ...then fall back to a different model
  allowed_fails: 3                   # after 3 failures in a minute, cool the deployment down
  cooldown_time: 30
  timeout: 120
  redis_host: os.environ/REDIS_HOST  # shared state: rate-limit counters and cooldowns across replicas
  redis_port: 6379

litellm_settings:
  drop_params: true
  # Exact-match response cache in Redis. Only for deterministic, non-personal prompts (classification,
  # extraction). Apps opt out per request with {"cache": {"no-cache": true}}.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 600
    supported_call_types: ["acompletion", "anthropic_messages"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # admin only; rendered from OpenBao at boot
  database_url: os.environ/DATABASE_URL          # keys, teams, budgets, spend logs
  # No key_management_system: LiteLLM's Vault integration is an Enterprise feature. The open-source
  # path is the entrypoint below rendering secrets from OpenBao into the process env at boot.
  disable_spend_logs: false
  store_prompts_in_spend_logs: false             # spend and metadata yes, prompt text no
  proxy_batch_write_at: 5                        # flush spend to Postgres every 5 s (default is slower)

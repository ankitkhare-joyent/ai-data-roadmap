[project]
name = "serving-lab"
version = "0.1.0"
description = "Lesson 4: self-hosted LLM serving: sizing, benchmarking, inference-aware routing, Kubernetes manifests"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
    "starlette>=1.7",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

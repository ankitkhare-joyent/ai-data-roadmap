[tools]
python = "3.13"
uv = "0.12.22"

[env]
_.file = ".env"            # optional ANTHROPIC_API_KEY for `mise run demo-claude`
PYTHONPATH = "src"

[tasks.sync]
run = "uv sync"

[tasks.test]
run = "uv run pytest -q"

[tasks.demo]
description = "Two A2A specialist agents + an orchestrator, all local (no Docker, no API key)"
run = "uv run python -m multi_agent.demo"

[tasks.demo-claude]
description = "Same, with Claude choosing which agents to call from their Agent Cards"
run = "uv run python -m multi_agent.demo --claude"

[tasks.serve]
description = "Run both specialist agents on :49701 and :49702 for the lab (tokens in .lab-tokens)"
run = "uv run python -m multi_agent.serve"

[tasks.reset]
description = "Forget old lab tokens: the lab's starting point (the agents keep no state between runs)"
run = "rm -f .lab-tokens && uv sync -q"

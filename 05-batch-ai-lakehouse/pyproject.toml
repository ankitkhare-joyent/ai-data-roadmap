[project]
name = "lakehouse-ai"
version = "0.1.0"
description = "Lesson 5: batch AI on the lakehouse: incremental LLM enrichment into Iceberg, embeddings into Lance, evals and cost per run"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]>=0.12,<0.13",
    "pyarrow>=25",
    "pylance>=12",
    "anthropic>=1.11,<2",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

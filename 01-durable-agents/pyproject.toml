[project]
name = "durable-agent"
version = "0.1.0"
description = "Lesson 1: a Claude agent that survives crashes and waits for human approval, on Temporal, with secrets in OpenBao"
requires-python = ">=3.13,<3.14"
dependencies = [
    "temporalio>=1.34,<2",
    "anthropic>=1.11,<2",
    "httpx>=0.28",
    "cryptography>=50",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.14",
]

[tool.uv]
package = false          # run from src/ (PYTHONPATH), same as the other labs

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

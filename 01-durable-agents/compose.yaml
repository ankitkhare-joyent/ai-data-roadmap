# Lesson 1: durable agent on Temporal, secrets in OpenBao.
#
#   cli ──start/approve──> temporal <──poll── worker ──> Claude (or scripted LLM), fleet API
#    └──────── both read the payload key from OpenBao; only the worker reads the Anthropic key
#
# Ports (127.0.0.1 only, 49xxx so this runs beside the other labs):
#   49200 OpenBao UI   49233 Temporal gRPC   49234 Temporal UI
name: durable-agent

x-app: &app
  build: .
  image: durable-agent/app:dev
  environment: &app-env
    BAO_ADDR: http://openbao:8200
    TEMPORAL_ADDRESS: temporal:7233

services:
  openbao:
    image: quay.io/openbao/openbao:2.7.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /openbao/seal
        [ -s /openbao/seal/unseal.key ] || head -c 32 /dev/urandom > /openbao/seal/unseal.key
        chown -R openbao:openbao /openbao/seal /openbao/file && chmod 400 /openbao/seal/unseal.key
        exec docker-entrypoint.sh bao server -config=/openbao/config/config.hcl
    user: "0:0"   # 2.7 images default to the openbao user; start as root to prepare the volume, then
                  # docker-entrypoint.sh drops to openbao before exec'ing the server
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:49200:8200"]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - bao-data:/openbao/file
      - bao-seal:/openbao/seal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200' || exit 1"]
      interval: 3s
      retries: 30
    mem_limit: 256m

  # LOCAL: the single-binary dev server with a SQLite file on a volume, so history survives restarts.
  # Production: Temporal Cloud, or the Helm chart on Postgres/Cassandra with separate frontend,
  # history, matching and worker services.
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233",
              "--db-filename", "/var/lib/temporal/temporal.db"]
    user: "0:0"
    ports: ["127.0.0.1:49233:7233", "127.0.0.1:49234:8233"]
    volumes: [temporal-data:/var/lib/temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      retries: 40
    mem_limit: 512m

  bao-bootstrap:
    <<: *app
    command: ["python", "-m", "durable_agent.bao_bootstrap"]
    user: "0:0"   # LOCAL: writes into fresh named volumes
    environment:
      <<: *app-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [bao-init:/bootstrap/init, bao-approle:/bootstrap/approle]
    depends_on: { openbao: { condition: service_healthy } }
    profiles: [setup]

  worker:
    <<: *app
    command: ["python", "-m", "durable_agent.worker"]
    environment:
      <<: *app-env
      LLM_MODE: ${LLM_MODE:-scripted}          # scripted | claude
      FLEET_FLAKY_STOPS: ${FLEET_FLAKY_STOPS:-1}
      BAO_APPROLE_DIR: /bootstrap/approle/agent-worker
    volumes: [bao-approle:/bootstrap/approle:ro, fleet-data:/data]
    depends_on:
      openbao: { condition: service_healthy }
      temporal: { condition: service_healthy }
    mem_limit: 512m
    stop_grace_period: 25s

  cli:
    <<: *app
    entrypoint: ["python", "-m", "durable_agent.cli"]
    environment:
      <<: *app-env
      BAO_APPROLE_DIR: /bootstrap/approle/agent-cli
    volumes: [bao-approle:/bootstrap/approle:ro]
    profiles: [tools]

volumes:
  bao-data: {}
  bao-seal: {}
  bao-init: {}
  bao-approle: {}
  temporal-data: {}
  fleet-data: {}
